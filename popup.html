<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { 
      width: 400px; 
      padding: 15px; 
      font-family: 'Segoe UI', sans-serif;
    }
    .header {
      text-align: center;
      margin-bottom: 15px;
    }
    .icon { font-size: 30px; }
    h3 { margin: 10px 0; color: #333; }
    .status { 
      color: green; 
      font-weight: bold; 
      font-size: 12px;
      margin: 5px 0;
    }
    .section {
      margin: 15px 0;
      padding: 10px;
      background: #f5f5f5;
      border-radius: 8px;
    }
    .section-title {
      font-weight: bold;
      margin-bottom: 8px;
      color: #555;
      font-size: 13px;
    }
    textarea {
      width: 100%;
      height: 150px;
      padding: 8px;
      border: 2px solid #ddd;
      border-radius: 5px;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      resize: vertical;
      box-sizing: border-box;
    }
    textarea:focus {
      outline: none;
      border-color: #667eea;
    }
    .btn {
      width: 100%;
      padding: 10px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      font-size: 13px;
    }
    .btn:hover {
      opacity: 0.9;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .hint {
      font-size: 11px;
      color: #666;
      margin-top: 5px;
      line-height: 1.4;
    }
    .success {
      background: #4caf50;
      color: white;
      padding: 8px;
      border-radius: 5px;
      margin-top: 10px;
      font-size: 12px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="icon">🍽️</div>
    <h3>Auto Fill School Center</h3>
    <div class="status">✓ Extension đang hoạt động</div>
  </div>

  <div class="section">
    <div class="section-title">📋 Paste Data từ Excel:</div>
    <textarea id="excelData" placeholder="Paste 5 cột từ Excel:&#10;Mã [TAB] Tên [TAB] Gram [TAB] Hệ số [TAB] Giá&#10;&#10;Ví dụ:&#10;GAOTE	Gạo thơm	87.5	0	21000&#10;DUONG	Đường	12.5	0	33000"></textarea>
    <div class="hint">
      💡 Copy 5 cột từ Excel và paste vào đây, sau đó click "Cập nhật Database"
    </div>
    <button class="btn" id="updateBtn">🔄 Cập nhật Database</button>
    <div class="success" id="successMsg">✓ Đã cập nhật database thành công!</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
